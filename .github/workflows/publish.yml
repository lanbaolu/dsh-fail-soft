name: publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  id-token: write # Required for npm Trusted Publishing via OIDC
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Plugin compliance (dsh-plugin-standard)
        run: npx --yes dsh-plugin-standard@2 .
      - name: Tests
        run: npm test

  publish:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # 本插件 host 为手写 JS、client 已构建并随仓库提交，lib/ 与
      # cordis.patch.yml 即发布产物，无需 npm ci / build。
      - name: Publish to npm
        run: npm publish --provenance --access public
