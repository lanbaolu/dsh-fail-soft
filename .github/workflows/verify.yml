name: Verify (dsh-plugin-standard)

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Plugin compliance (dsh-plugin-standard)
        run: npx --yes dsh-plugin-standard@2 .
      - name: Tests
        run: npm test
